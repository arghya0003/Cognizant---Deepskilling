<div class="box">
  <h3 [style.color]="cohort.currentStatus === 'Ongoing' ? 'green' : 'blue'">
    {{ cohort.cohortCode }} -
    <span>{{ cohort.technology }}</span>
  </h3>
  <dl>
    <dt>Started On</dt>
    <dd>{{ cohort.startDate }}</dd>
    <dt>Current Status</dt>
    <dd>{{ cohort.currentStatus }}</dd>
    <dt>Coach</dt>
    <dd>{{ cohort.coachName }}</dd>
    <dt>Trainer</dt>
    <dd>{{ cohort.trainerName }}</dd>
  </dl>
</div>
