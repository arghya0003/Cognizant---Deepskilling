<div class="formatstyle">
  <h1><font color="Brown">Student Details:</font></h1>
  <div class="Name">
    <b><span>Name: </span></b>
    <span>{{ name }}</span>
  </div>
  <div class="School">
    <b><span>School: </span></b>
    <span>{{ school }}</span>
  </div>
  <div class="Total">
    <b><span>Total: </span></b>
    <span>{{ total }}</span>
    <span>Marks</span>
  </div>
  <div class="Score">
    <b>Score: </b>
    <span>{{ calcScore() }}</span>
  </div>
</div>
