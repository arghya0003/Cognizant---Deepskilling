<div class="App" style="margin-left: 180px; margin-top: 30px">
  <h1>Office Space Rental App</h1>

  <img src="office.png" alt="Office" width="500" height="200" />

  @for (office of offices; track office.name) {
    <div style="margin-left: 5px">
      <h1>Name: {{ office.name }}</h1>
      <h2 [style.color]="office.rent < 60000 ? 'red' : 'green'">Rent: {{ office.rent }}</h2>
      <h3>Address: {{ office.address }}</h3>
      <br />
    </div>
  }
</div>
